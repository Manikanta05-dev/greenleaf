version: '3.9'

services:
  # ── PostgreSQL database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-greenleaf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Run Prisma migrations before the app starts ───────────────────────────
  migrate:
    build: .
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-greenleaf}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js app ───────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL:              postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-greenleaf}
      AUTH_SECRET:               ${AUTH_SECRET}
      NEXT_PUBLIC_APP_URL:       ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      RAZORPAY_KEY_ID:           ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET:       ${RAZORPAY_KEY_SECRET}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/auth/me || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
